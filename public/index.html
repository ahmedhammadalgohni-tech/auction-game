<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مزاد اللاعبين - أونلاين</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root {
  color-scheme: dark;
  box-sizing: border-box;
  --bg: #0b0e14;
  --pn: #161b26;
  --tx: #eef1f7;
  --mu: #8b93a7;
  --ac: #2563eb; 
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--tx);
  font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  min-height: 100vh;
}
#app {
  max-width: 1020px;
  margin: auto;
  padding: 16px;
  text-align: center;
}
h1 { margin: 12px 0; font-weight: 900; }
button {
  font: inherit;
  cursor: pointer;
  border: 0;
  border-radius: 10px;
  padding: 10px 18px;
  background: var(--ac);
  color: #fff;
  font-weight: 700;
  transition: all 0.2s ease;
}
button:disabled { background: #232a3b; color: #555; cursor: not-allowed; }
input {
  font: inherit;
  padding: 10px;
  border-radius: 8px;
  border: 1px solid #333b50;
  background: #0e1118;
  color: var(--tx);
  width: 220px;
  text-align: center;
  margin: 6px;
}
.panel {
  background: var(--pn);
  border-radius: 16px;
  padding: 20px;
  margin: 14px 0;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; align-items: center; }
.timer { font-size: 2.8rem; font-weight: 900; color: #60a5fa; }
.timer.low { color: #ef4444; }

/* تصميم بطاقة اللاعب النصية بالكامل بدون صور */
.card {
  --f: 16px;
  font-size: var(--f);
  width: 14em;
  aspect-ratio: 4/3;
  border-radius: 1em;
  padding: 0.8em;
  position: relative;
  display: inline-block;
  margin: 10px auto;
  vertical-align: top;
  box-shadow: 0 8px 16px rgba(0,0,0,0.5);
}
.card .in {
  background: #1e293b;
  color: #fff;
  border-radius: 0.6em;
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.5em;
  padding: 10px;
}
.card .name {
  font-size: 1.4em;
  font-weight: 900;
  color: #38bdf8;
}
.card .rating {
  font-size: 1.8em;
  font-weight: 900;
  color: #4ade80;
}
.card .tier {
  font-size: 0.85em;
  font-weight: 700;
  padding: 4px 10px;
  border-radius: 6px;
  background: rgba(255,255,255,0.1);
}

/* فريمات التصنيفات */
.common { background: linear-gradient(135deg, #475569, #334155); }
.rare { background: linear-gradient(135deg, #1d4ed8, #2563eb); box-shadow: 0 0 15px rgba(37,99,235,0.4); }
.epic { background: linear-gradient(135deg, #be185d, #db2777); box-shadow: 0 0 18px rgba(219,39,119,0.5); }
.legend { background: linear-gradient(135deg, #b45309, #d97706); box-shadow: 0 0 22px rgba(217,119,6,0.6); }

.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-top: 14px; }
.pl { background: var(--pn); border-radius: 14px; padding: 12px; border: 2px solid transparent; }
.pl.lead { border-color: #22c55e; background: #14291f; }
.error { color: #ef4444; margin-top: 10px; font-weight: bold; }
</style>
</head>
<body>
<div id="app"></div>

<script>
const socket = io();
const $ = s => document.querySelector(s);
const app = $('#app');
let myName = '';
let currentRoom = '';
let timerInterval = null;

function getTier(r) {
  if (r >= 96) return 'legend';
  if (r >= 91) return 'epic';
  if (r >= 86) return 'rare';
  return 'common';
}

const tierNames = { legend: 'أسطوري', epic: 'خارق', rare: 'نادر', common: 'عادي' };

function startCountdown(seconds) {
  let timeLeft = seconds;
  if (timerInterval) clearInterval(timerInterval);
  
  const tmElement = document.getElementById('tm');
  if (!tmElement) return;

  timerInterval = setInterval(() => {
    timeLeft--;
    tmElement.textContent = timeLeft;
    
    if (timeLeft <= 5) {
      tmElement.classList.add('low');
    } else {
      tmElement.classList.remove('low');
    }
    
    if (timeLeft <= 0) {
      clearInterval(timerInterval);
      // انتهاء الوقت لجولة المزاد الحالية
    }
  }, 1000);
}

function renderCard(cardData) {
  const t = getTier(cardData.r);
  return `
    <div class="card ${t}">
      <div class="in">
        <div class="name">${cardData.n}</div>
        <div class="rating">⚡ ${cardData.r}</div>
        <div class="tier">${tierNames[t]}</div>
      </div>
    </div>
  `;
}

function showHome() {
  app.innerHTML = `
    <h1>🏆 مزاد اللاعبين أونلاين</h1>
    <div class="panel">
      <p>أدخل اسمك أولاً:</p>
      <input type="text" id="pName" placeholder="اسمك المستعار" value="${myName}"><br>
      <div style="margin-top: 15px;" class="row">
        <button onclick="createRoom()">إنشاء غرفة جديدة</button>
      </div>
      <hr style="border-color:#333b50; margin:20px 0;">
      <p>أو انضم لغرفة صديق:</p>
      <input type="text" id="rCode" placeholder="رمز الغرفة (مثل AB123)"><br>
      <div style="margin-top: 10px;">
        <button style="background:#16a34a" onclick="joinRoom(event)">انضمام للغرفة</button>
      </div>
      <div id="err" class="error"></div>
    </div>
  `;
}

function createRoom() {
  myName = $('#pName').value.trim();
  if (!myName) return $('#err').textContent = 'الرجاء إدخال اسمك أولاً!';
  socket.emit('create-room', myName);
}

function joinRoom(event) {
  if (event) event.preventDefault();
  myName = $('#pName').value.trim();
  const roomCode = $('#rCode').value.trim().toUpperCase();
  
  if (!myName) return $('#err').textContent = 'الرجاء إدخال اسمك أولاً!';
  if (!roomCode) return $('#err').textContent = 'الرجاء إدخال رمز الغرفة!';
  
  $('#err').textContent = '';
  currentRoom = roomCode;
  socket.emit('join-room', { roomCode, playerName: myName });
}

socket.on('room-created', (roomCode) => {
  currentRoom = roomCode;
  showLobby([{ name: myName }], true);
});

socket.on('update-lobby', (data) => {
  const playersList = data.players || data;
  const hostSocketId = data.hostId;
  const isMeHost = hostSocketId ? (hostSocketId === socket.id) : (playersList[0].name === myName);
  showLobby(playersList, isMeHost);
});

socket.on('error-msg', (msg) => {
  $('#err').textContent = msg;
});

function showLobby(players, isHost) {
  app.innerHTML = `
    <h1>🏆 غرفة الانتظار</h1>
    <div class="panel">
      <h3>رمز الغرفة: <span style="color:#60a5fa; font-size:1.8rem;">${currentRoom}</span></h3>
      <p style="color:var(--mu)">شارك هذا الرمز مع أصدقائك (الحد الأقصى 4 لاعبين)</p>
      <div class="grid" style="margin: 20px 0;">
        ${players.map(p => `<div class="pl"><b>👤 ${p.name}</b></div>`).join('')}
      </div>
      ${isHost ? `<button style="background:#16a34a; font-size:1.2rem;" onclick="startGame()">بدء اللعبة الآن</button>` : `<p style="color:#60a5fa">بانتظار أن يبدأ المضيف اللعبة...</p>`}
    </div>
  `;
}

function startGame() {
  socket.emit('start-game', currentRoom);
}

// استقبال أحداث اللعبة والمزاد
socket.on('game-started', (data) => {
  renderAuctionScreen(data);
  startCountdown(20); // عداد 20 ثانية لكل لاعب
});

socket.on('update-auction', (data) => {
  const bidEl = $('#currentBid');
  if (bidEl) bidEl.textContent = data.bid;
  
  document.querySelectorAll('.pl').forEach((el, idx) => {
    if (idx === data.lead) {
      el.classList.add('lead');
    } else {
      el.classList.remove('lead');
    }
  });
});

function renderAuctionScreen(data) {
  app.innerHTML = `
    <h1>🏆 المزاد المباشر أونلاين</h1>
    <div class="panel">
      <div id="tm" class="timer">20</div>
      ${renderCard(data.card)}
      <div style="font-size:1.4rem; margin:10px 0;">
        السعر الحالي: <b id="currentBid">${data.bid}</b> ريال
      </div>
      <div class="grid">
        ${data.players.map((p, i) => `
          <div class="pl ${data.lead === i ? 'lead' : ''}">
            <b>${p.name}</b>
            <div style="margin:4px 0">💰 الميزانية: ${p.budget} ريال</div>
            <button onclick="sendBid(${i})">+1 ريال</button>
          </div>
        `).join('')}
      </div>
    </div>
  `;
}

function sendBid(playerIndex) {
  socket.emit('place-bid', { roomCode: currentRoom, playerIndex });
}

showHome();
</script>
</body>
</html>
